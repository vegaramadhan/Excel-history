<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Excel Change Detector">
  <title>Excel Change Detector</title>
  <!--
    Dua lembar bertumpuk = file lama dan file baru.
    Tiga baris berwarna = kategori perubahan: hijau ditambahkan,
    amber berubah, merah dihapus. Garis tepi oranye adalah warna aksen aplikasi.
  -->
  <rect x="10.5" y="2" width="19.5" height="25" rx="3" fill="#e7e5e4"/>
  <rect x="2" y="5" width="19.5" height="25" rx="3" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <g>
    <rect x="6" y="11" width="11.5" height="2.6" rx="1.3" fill="#16a34a"/>
    <rect x="6" y="16.2" width="8" height="2.6" rx="1.3" fill="#f59e0b"/>
    <rect x="6" y="21.4" width="10" height="2.6" rx="1.3" fill="#dc2626"/>
  </g>
</svg>
